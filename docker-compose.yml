version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: new-api-postgres
    restart: always
    environment:
      POSTGRES_DB: newapi
      POSTGRES_USER: newapi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-newapi_secure_password_2026}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newapi -d newapi"]
      interval: 10s
      timeout: 5s
      retries: 5

  new-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: new-api:rk3318-subisle-deploy-20260620-v4
    container_name: new-api-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - SQL_DSN=postgres://newapi:${POSTGRES_PASSWORD:-newapi_secure_password_2026}@postgres:5432/newapi?sslmode=disable
      - SESSION_SECRET=${SESSION_SECRET:-your-random-session-secret-change-this}
      - TZ=Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  new-api-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
