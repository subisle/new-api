name: Build Baga Docker Artifact

on:
  workflow_dispatch:
  push:
    branches:
      - rk3318-subisle-deploy

jobs:
  build:
    name: Build amd64 image tar
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Write VERSION fallback
        run: |
          if [ ! -s VERSION ]; then
            echo "baga-${GITHUB_SHA::7}" > VERSION
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image tar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          tags: new-api-baga-subisle:${{ github.sha }}
          outputs: type=docker,dest=/tmp/new-api-baga-subisle-amd64.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compress artifact
        run: gzip -9 /tmp/new-api-baga-subisle-amd64.tar

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-api-baga-subisle-amd64
          path: /tmp/new-api-baga-subisle-amd64.tar.gz
          retention-days: 7
